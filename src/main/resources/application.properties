spring.application.name=practice
# Severity Order: TRACE < DEBUG < INFO < WARN < ERROR
logging.level.in.math2do.practice=DEBUG
server.servlet.context-path=/api/v1
# Redis related configs
#spring.redis.host=localhost
#spring.redis.port=6379
# Postgres related configs
spring.datasource.url=jdbc:postgresql://localhost:5432/practice-db
spring.datasource.username=username
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.driver-class-name=org.postgresql.Driver
# Hikari pool tuning
#spring.datasource.hikari.minimum-idle=5
#spring.datasource.hikari.maximum-pool-size=20
#spring.datasource.hikari.auto-commit=true
#spring.datasource.hikari.pool-name=MyHikariCP
#spring.datasource.hikari.connection-timeout=30000
# For Devtools
#spring.devtools.restart.enabled=true
#spring.devtools.livereload.enabled=false
# Hibernate configuration
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.stat=DEBUG
logging.level.org.hibernate.SQL=DEBUG
## Liquibase configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml