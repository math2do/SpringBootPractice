databaseChangeLog:
  - changeSet:
      id: 007-create-author
      author: math2do
      changes:
        - createTable:
            tableName: author
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: biography
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: date_of_birth
                  type: DATE
                  constraints:
                    nullable: true
